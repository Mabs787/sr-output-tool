<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Output Tool</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div class="title-row">
        <h1>SR Output Tool</h1>
        <button
          id="close-btn"
          class="icon-btn"
          type="button"
          aria-label="Close inspector"
        >
          ×
        </button>
      </div>
      <p class="description">
        Pick an element on the page and review the simulated screen reader
        output.
      </p>

      <div id="controls">
        <button id="select-btn" class="btn btn-primary">Pick On Page</button>
        <button id="copy-btn" class="btn btn-secondary" disabled>
          Copy Output
        </button>
        <button id="clear-btn" class="btn btn-secondary" disabled>
          Clear Log
        </button>
      </div>

      <div id="status" class="status hidden"></div>

      <div id="selected-element" class="selected-element hidden">
        <h2>Selected Element</h2>
        <p id="selected-element-text"></p>
      </div>

      <div id="log-container" class="hidden">
        <h2>Screen Reader Output</h2>
        <ol id="log-list"></ol>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
