<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR Output Tool</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div class="title-row">
        <h1>SR Output Tool</h1>
        <div class="title-actions">
          <button id="feedback-btn" class="feedback-btn" type="button">
            Feedback
          </button>
          <button
            id="settings-btn"
            class="icon-btn"
            type="button"
            aria-label="Open appearance settings"
            aria-expanded="false"
            aria-controls="settings-menu"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="18"
              height="18"
            >
              <path
                d="M12 7.25a4.75 4.75 0 1 0 0 9.5 4.75 4.75 0 0 0 0-9.5Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M12 2.75v2.5m0 13.5v2.5M4.93 4.93 6.7 6.7m10.6 10.6 1.77 1.77M2.75 12h2.5m13.5 0h2.5M4.93 19.07 6.7 17.3m10.6-10.6 1.77-1.77"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          </button>
          <button
            id="close-btn"
            class="icon-btn"
            type="button"
            aria-label="Close inspector"
          >
            ×
          </button>
        </div>
      </div>
      <p class="description">
        Pick an element on the page and review the simulated screen reader
        output.
      </p>

      <div id="settings-menu" class="settings-menu hidden">
        <h2 class="settings-title">Appearance</h2>
        <div class="theme-options" aria-label="Theme preference">
          <label>
            <input type="radio" name="theme" value="light" />
            <span>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="M12 7.25A4.75 4.75 0 1 0 12 16.75 4.75 4.75 0 0 0 12 7.25Zm0-4.5v2.5m0 13.5v2.5M4.93 4.93 6.7 6.7m10.6 10.6 1.77 1.77M2.75 12h2.5m13.5 0h2.5M4.93 19.07 6.7 17.3m10.6-10.6 1.77-1.77"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.7"
                />
              </svg>
              Light
            </span>
          </label>
          <label>
            <input type="radio" name="theme" value="dark" />
            <span>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="M20.2 14.7A7.6 7.6 0 0 1 9.3 3.8 8.7 8.7 0 1 0 20.2 14.7Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
              Dark
            </span>
          </label>
          <label>
            <input type="radio" name="theme" value="system" />
            <span>
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path
                  d="m5 12 4 4L19 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
              System
            </span>
          </label>
        </div>
      </div>

      <div id="controls">
        <button id="select-btn" class="btn btn-primary">Pick On Page</button>
        <button id="copy-btn" class="btn btn-secondary" disabled>
          Copy Output
        </button>
        <button id="clear-btn" class="btn btn-secondary" disabled>
          Clear Log
        </button>
      </div>

      <div id="status" class="status hidden"></div>

      <div id="selected-element" class="selected-element hidden">
        <h2>Selected Element</h2>
        <p id="selected-element-text"></p>
      </div>

      <div id="log-container" class="hidden">
        <h2>Screen Reader Output</h2>
        <ol id="log-list"></ol>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
