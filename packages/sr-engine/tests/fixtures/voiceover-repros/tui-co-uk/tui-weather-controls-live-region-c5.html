<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TUI weather controls live region C5 repro</title>
  <style>
    .top-mobile {
      display: none;
    }
  </style>
</head>
<body>
  <main data-sr-scan-root>
    <h1>TUI Homepage</h1>
    <section>
      <div>
        <div>Where's hot when?</div>
        <div>Let our handy tool help you decide where to head.</div>
      </div>
      <div>
        <div>Changing any of the fields will automatically update the context.</div>
        <div>
          <div>
            <div>When</div>
            <div>
              <select>
                <option value="January">January</option>
                <option value="February">February</option>
              </select>
            </div>
          </div>
          <div>
            <div>Where</div>
            <div>
              <div role="combobox" aria-haspopup="listbox" aria-owns="react-autowhatever-1" aria-expanded="false">
                <input type="text" aria-autocomplete="list" aria-controls="react-autowhatever-1" placeholder="Anywhere">
                <div id="react-autowhatever-1" role="listbox"></div>
              </div>
            </div>
          </div>
        </div>
        <div>
          <div>
            <div>Weather</div>
            <div>
              <button type="button"><span>Any</span></button>
              <button type="button"><span>Warm</span><span>16 - 22ºC</span></button>
              <button type="button"><span>Hot</span><span>23 - 28ºC</span></button>
              <button type="button"><span>Very Hot</span><span>29 - 40ºC</span></button>
            </div>
          </div>
        </div>
      </div>
      <div aria-live="polite" role="region">There are now 30 destinations.</div>
      <div aria-live="polite" role="region">
        <div>
          <div>
            <a href="https://www.tui.co.uk/destinations/asia/thailand/thailand/koh-samui/holidays-koh-samui.html">
              <div class="top-mobile">
                <div><span aria-hidden="true"></span><span>28 °C</span></div>
                <div><span>Koh Samui, Thailand</span></div>
              </div>
              <div>
                <div><span>Koh Samui, Thailand</span></div>
                <div><span aria-hidden="true"></span><span>28ºC</span></div>
              </div>
              <div>
                <div><div><span aria-hidden="true"></span><span>2%</span></div><div><span>chance of sun</span></div></div>
                <div><div><span aria-hidden="true"></span><span>110mm</span></div><div><span>rain per month</span></div></div>
                <div><span aria-hidden="true"></span></div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
