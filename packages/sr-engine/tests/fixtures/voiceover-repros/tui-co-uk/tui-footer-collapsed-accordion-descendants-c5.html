<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TUI footer collapsed accordion descendants C5 repro</title>
</head>
<body>
  <footer data-sr-scan-root>
    <div>
      <div>
        <div>
          <ul role="presentation">
            <li role="presentation">
              <button aria-expanded="false">Popular Destinations</button>
            </li>
            <div aria-label="Popular Destinations">
              <a href="https://www.tui.co.uk/destinations/europe/turkey/turkey-bodrum/holidays-turkey-bodrum.html">Bodrum Holidays</a>
              <a href="https://www.tui.co.uk/destinations/europe/spain/canary-islands/holidays-canary-islands.html">Canary Islands Holidays</a>
            </div>
            <li role="presentation">
              <button aria-expanded="false">Flights To</button>
            </li>
            <div aria-label="Flights To">
              <a href="https://www.tui.co.uk/flight/spain/valencia-region-flights">Alicante Flights</a>
              <a href="https://www.tui.co.uk/flight/barbados-flights">Barbados Flights</a>
            </div>
          </ul>
        </div>
        <div>
          <div aria-label="Company Information &amp; Policies">
            <span>Company Information &amp; Policies</span>
            <ul role="presentation">
              <li role="presentation">
                <a role="link" href="https://www.tui.co.uk/destinations/info/privacy-notice">Privacy notice</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
