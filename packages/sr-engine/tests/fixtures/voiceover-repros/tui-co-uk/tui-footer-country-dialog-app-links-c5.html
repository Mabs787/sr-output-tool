<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TUI footer country dialog app links C5 repro</title>
</head>
<body data-sr-scan-root>
  <footer>
    <div>
      <div>
        <div>
          <div>
            <div>
              <img alt="Mail">
              <div>Don't miss out! <a href="https://www.tui.co.uk/holidays/competitions/giveaway/">Sign up for holiday offers</a></div>
            </div>
            <div>
              <div>
                <button aria-label="TUI UK" aria-haspopup="dialog" aria-expanded="false">
                  <img alt="uk"><span>TUI UK</span>
                </button>
              </div>
              <div role="dialog" aria-modal="true" aria-labelledby="flag-selector-header">
                <div>
                  <div>
                    <div>
                      <span id="flag-selector-header">Hello, you are currently browsing:</span>
                      <div><img alt="uk"><span>TUI UK</span></div>
                    </div>
                    <button aria-label="Close country selector"></button>
                  </div>
                  <div>
                    <h4>Please choose your TUI website:</h4>
                    <ul aria-label="country List">
                      <li>
                        <a href="https://www.tuiholidays.ie/" aria-label="TUI Republic of Ireland">
                          <img alt="ie"><span>TUI Republic of Ireland</span>
                        </a>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
              <div aria-label="Social media links">
                <div role="presentation">
                  <span role="presentation">
                    <a href="https://www.facebook.com/TUIUnitedKingdom" aria-label="Facebook"><img alt="Facebook" aria-hidden="true"></a>
                  </span>
                  <span role="presentation">
                    <a href="https://x.com/TUIUK" aria-label="twitter"><img alt="twitter" aria-hidden="true"></a>
                  </span>
                </div>
              </div>
            </div>
          </div>
          <div>
            <h2>Download the TUI App</h2>
            <div aria-label="Download the TUI App">
              <a href="https://tui.onelink.me/FCER/4fa0tkf0" title="GPlay"><img alt="GPlay"></a>
              <a href="https://tui.onelink.me/FCER/4fa0tkf0" title="AppStore"><img alt="AppStore"></a>
              <img alt="QR" title="QR" role="button" tabindex="0">
            </div>
          </div>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
