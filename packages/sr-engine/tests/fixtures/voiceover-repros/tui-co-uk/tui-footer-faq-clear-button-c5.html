<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TUI footer FAQ clear button C5 repro</title>
</head>
<body data-sr-scan-root>
  <footer>
    <div>
      <div>
        <h2>Can't find what you're looking for?</h2>
        <div>
          <div>
            <form disabled="disabled">
              <button type="submit" aria-label="Submit"></button>
              <input type="text" name="term" required aria-autocomplete="list" aria-expanded="false" role="combobox" aria-controls="suggestions" tabindex="0" id="faq-search-bar">
              <ul id="suggestions" role="listbox" aria-hidden="true" aria-labelledby="faq-search-bar"></ul>
              <button type="button" aria-label="Clear"></button>
            </form>
          </div>
        </div>
        <div>
          <a href="https://www.tui.co.uk/destinations/faq" title="Ask a question?">Ask a question?</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
