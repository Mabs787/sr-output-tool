<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Local Navigation Empty Generic Before Nav Repro</title>
    <style>
      .scan-root {
        font: 16px/1.4 system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 48rem;
      }

      .global-nav,
      .local-nav {
        margin-block: 1rem;
      }

      .global-list,
      .local-list {
        display: flex;
        gap: 1rem;
        list-style: none;
        padding: 0;
      }

      .empty-generic {
        min-height: 1px;
      }

      [hidden],
      .visually-hidden-state {
        display: none;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root class="scan-root">
      <nav aria-label="Global" class="global-nav" data-sr-dom-node-id="100">
        <ul class="global-list">
          <li><a href="https://example.test/store">Store</a></li>
          <li><a href="https://example.test/mac">Mac</a></li>
          <li><button type="button" aria-label="Search apple.com" aria-expanded="false">Search</button></li>
          <li><button type="button" aria-label="Shopping Bag" aria-expanded="false">Bag</button></li>
        </ul>
      </nav>

      <div class="empty-generic" data-sr-dom-node-id="101"></div>

      <input id="local-nav-state" class="visually-hidden-state" type="checkbox" aria-hidden="true" data-sr-dom-node-id="102">
      <div class="visually-hidden-state" data-sr-dom-node-id="103">
        <button type="button" aria-controls="local-nav-tray">Open menu</button>
        <button type="button" aria-controls="local-nav-tray">Close menu</button>
      </div>

      <nav aria-label="Local" class="local-nav" data-sr-dom-node-id="104">
        <div data-sr-dom-node-id="105">
          <a href="https://example.test/accessibility">Accessibility</a>
          <div id="local-nav-tray">
            <ul class="local-list">
              <li><a aria-current="page" href="https://example.test/accessibility">Overview</a></li>
              <li><a href="https://example.test/accessibility/features">Features</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </main>
  </body>
</html>
