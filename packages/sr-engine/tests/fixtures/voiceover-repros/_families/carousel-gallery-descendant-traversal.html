<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C5 carousel gallery descendant traversal</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 Arial, sans-serif;
      }

      [data-sr-scan-root] {
        max-width: 820px;
        padding: 24px;
      }

      [role="list"] {
        list-style: none;
        margin: 8px 0;
        padding: 0;
      }

      [role="listitem"] {
        margin: 10px 0;
      }

      [data-c5-offscreen="true"] {
        position: absolute;
        left: -10000px;
        top: auto;
      }

      img {
        display: block;
        height: 40px;
        width: 80px;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-c5-family="carousel-gallery-descendant-traversal">
      <p>C5 identity carousel gallery descendant traversal</p>

      <section aria-label="Positive gallery" data-c5-control="positive-gallery">
        <div role="group" aria-label="Gallery group">
          <ul role="list" aria-label="Gallery slides">
            <li role="listitem" aria-current="true">
              <figure>
                <img alt="Gallery item one" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
                <figcaption tabindex="-1">First gallery item.</figcaption>
              </figure>
            </li>
            <li role="listitem" data-c5-offscreen="true">
              <figure>
                <img alt="Gallery item two" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
                <figcaption tabindex="-1">Second gallery item.</figcaption>
              </figure>
            </li>
          </ul>
          <ul role="list" aria-label="Gallery controls">
            <li role="listitem"><button type="button" aria-label="Previous gallery item">Previous</button></li>
            <li role="listitem"><button type="button" aria-label="Next gallery item">Next</button></li>
          </ul>
        </div>
      </section>

      <section aria-label="Negative plain list" data-c5-control="negative-plain-list">
        <ul role="list">
          <li role="listitem"><a href="#plain-one">Plain item one</a></li>
          <li role="listitem"><a href="#plain-two">Plain item two</a></li>
        </ul>
      </section>

      <p data-c5-control="tail-guard">C5 tail carousel gallery descendant traversal</p>
    </main>
  </body>
</html>
