<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>C5 media gallery control context</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.4 Arial, sans-serif;
      }

      [data-sr-scan-root] {
        max-width: 820px;
        padding: 24px;
      }

      [role="list"] {
        list-style: none;
        margin: 8px 0;
        padding: 0;
      }

      [role="listitem"] {
        margin: 10px 0;
      }

      [data-c5-hidden="true"] {
        display: none;
      }

      video,
      img {
        display: block;
        height: 48px;
        width: 96px;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-c5-family="media-gallery-control-context">
      <p>C5 identity media gallery control context</p>

      <section aria-labelledby="media-gallery-heading" data-c5-control="positive-media-gallery-controls">
        <h2 id="media-gallery-heading">Positive media gallery</h2>
        <div role="group" aria-labelledby="media-gallery-heading">
          <ul id="media-slide-list" role="list" aria-label="Media slides">
            <li role="listitem" aria-current="true">
              <figure>
                <video role="img" aria-label="Short media sample" muted playsinline></video>
                <figcaption tabindex="-1">First media sample.</figcaption>
              </figure>
            </li>
            <li role="listitem" data-c5-hidden="true">
              <figure>
                <img alt="Second media sample" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
                <figcaption tabindex="-1">Second media sample.</figcaption>
              </figure>
            </li>
          </ul>
          <div role="group" aria-label="Media gallery controls">
            <button type="button" aria-label="Previous media item" aria-controls="media-slide-list">Previous</button>
            <button type="button" aria-label="Play media sample" aria-pressed="false">Play</button>
            <a href="#download" download>Download sample</a>
            <button type="button" aria-label="Next media item" aria-controls="media-slide-list">Next</button>
          </div>
        </div>
      </section>

      <section aria-labelledby="standalone-media-heading" data-c5-control="negative-standalone-media-controls">
        <h2 id="standalone-media-heading">Negative standalone media</h2>
        <figure>
          <img alt="Standalone image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
          <figcaption>Standalone caption</figcaption>
        </figure>
        <button type="button">Standalone button</button>
      </section>

      <p data-c5-control="tail-guard">C5 tail media gallery control context</p>
    </main>
  </body>
</html>
