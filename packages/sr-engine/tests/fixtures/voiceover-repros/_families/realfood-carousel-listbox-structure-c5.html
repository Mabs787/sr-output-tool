<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>RealFood carousel listbox structure C5</title></head>
  <body>
    <main data-sr-scan-root>
      <h1>RealFood C5 carousel listbox identity</h1>
      <section aria-labelledby="events-heading">
        <h2 id="events-heading">Events</h2>
        <ul data-carousel="always" class="slick-initialized slick-slider">
          <div aria-live="polite" class="slick-list draggable">
            <div class="slick-track" role="listbox">
              <li class="slick-slide slick-cloned" aria-hidden="true" tabindex="-1">
                <a href="/diwali" tabindex="-1"><img alt="Diwali"><span><h3>Diwali</h3></span></a>
              </li>
              <li class="slick-slide slick-current slick-active" role="option" aria-describedby="slick-slide01" aria-hidden="false">
                <a id="slick-slide01" href="/summer"><img alt="Summer"><span><h3>Summer recipes</h3></span></a>
              </li>
            </div>
          </div>
        </ul>
        <button type="button" aria-label="Previous">Previous</button>
        <button type="button" aria-label="Next">Next</button>
        <p aria-live="polite">6 of 6</p>
      </section>
      <p>RealFood carousel listbox positive control</p>
      <ul><li>Plain list negative control</li></ul>
      <p>RealFood carousel listbox tail guard</p>
    </main>
  </body>
</html>
