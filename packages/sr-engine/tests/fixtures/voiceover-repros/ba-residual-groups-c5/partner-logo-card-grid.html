<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partner logo card grid C.5</title>
    <style>
      body { font: 16px/1.4 Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 760px; }
      test-page-segment,
      test-card-grid,
      test-logo-card,
      test-control-panel { display: block; }
      test-card-grid { display: grid; gap: 16px; }
      img { width: 80px; height: 40px; }
      .controls { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main
      data-sr-scan-root
      data-sr-fixture-id="ba-residual-groups-c5/partner-logo-card-grid"
      data-sr-fixture-status="fixture-ready-awaiting-push"
    >
      <test-page-segment data-contract="partner-logo-card-grid">
        <h2>Partner cards</h2>
        <p>Each card keeps image alt text and a linked heading.</p>

        <test-card-grid>
          <test-logo-card>
            <img alt="Partner Alpha logo">
            <h3><a href="#alpha">Partner Alpha</a></h3>
          </test-logo-card>
          <test-logo-card>
            <img alt="Partner Beta logo">
            <h3><a href="#beta">Partner Beta</a></h3>
          </test-logo-card>
          <test-logo-card>
            <img alt="Partner Gamma logo">
            <h3><a href="#gamma">Partner Gamma</a></h3>
          </test-logo-card>
        </test-card-grid>
      </test-page-segment>

      <test-control-panel class="controls">
        <div role="group" aria-label="Named control group">
          <button type="button">Named control</button>
        </div>
        <div role="group">
          <button type="button">Ordinary control</button>
        </div>
      </test-control-panel>
    </main>
  </body>
</html>
