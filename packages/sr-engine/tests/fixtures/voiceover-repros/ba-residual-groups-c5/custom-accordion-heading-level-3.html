<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom accordion heading level 3 C.5</title>
    <style>
      body { font: 16px/1.4 Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      test-page-segment,
      test-accordion,
      test-accordion-item,
      test-control-panel { display: block; }
      .controls { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main
      data-sr-scan-root
      data-sr-fixture-id="ba-residual-groups-c5/custom-accordion-heading-level-3"
      data-sr-fixture-status="fixture-ready-awaiting-push"
    >
      <test-page-segment data-contract="custom-accordion-heading-level-3">
        <h2>Account questions</h2>
        <test-accordion heading-level="3">
          <test-accordion-item>
            <template shadowrootmode="open">
              <h3><button type="button" aria-expanded="false" aria-controls="panel-one"><slot name="summary"></slot></button></h3>
              <div id="panel-one" hidden><slot name="panel"></slot></div>
            </template>
            <span slot="summary">Where can I see points?</span>
            <p slot="panel">Open the account page.</p>
          </test-accordion-item>
          <test-accordion-item>
            <template shadowrootmode="open">
              <h3><button type="button" aria-expanded="false" aria-controls="panel-two"><slot name="summary"></slot></button></h3>
              <div id="panel-two" hidden><slot name="panel"></slot></div>
            </template>
            <span slot="summary">How do I update details?</span>
            <p slot="panel">Use the profile form.</p>
          </test-accordion-item>
        </test-accordion>
      </test-page-segment>

      <test-control-panel class="controls">
        <div role="group" aria-label="Named control group">
          <button type="button">Named control</button>
        </div>
        <div role="group">
          <button type="button">Ordinary control</button>
        </div>
      </test-control-panel>
    </main>
  </body>
</html>
