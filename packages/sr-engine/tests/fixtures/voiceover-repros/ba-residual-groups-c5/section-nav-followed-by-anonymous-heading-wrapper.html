<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Section nav followed by anonymous heading wrapper C.5</title>
    <style>
      body { font: 16px/1.4 Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      test-page-segment,
      test-nav-link,
      test-content-card,
      test-image-shell,
      test-control-panel { display: block; }
      img { width: 96px; height: 54px; }
      .controls { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main
      data-sr-scan-root
      data-sr-fixture-id="ba-residual-groups-c5/section-nav-followed-by-anonymous-heading-wrapper"
      data-sr-fixture-status="fixture-ready-awaiting-push"
    >
      <test-page-segment data-contract="section-nav-followed-by-anonymous-heading-wrapper">
        <h1>Family guide</h1>
        <nav aria-label="Pages in this section">
          <h2>Pages in this section</h2>
          <test-nav-link><a href="#before">Before travel</a></test-nav-link>
          <test-nav-link><a href="#during">During travel</a></test-nav-link>
        </nav>

        <test-content-card>
          <test-image-shell>
            <img alt="Guide preview">
          </test-image-shell>
          <h2 id="before">Before travel</h2>
          <p>Pack documents and check the route.</p>
          <a href="#details">Read details</a>
        </test-content-card>
      </test-page-segment>

      <test-control-panel class="controls">
        <div role="group" aria-label="Named control group">
          <button type="button">Named control</button>
        </div>
        <div role="group">
          <button type="button">Ordinary control</button>
        </div>
      </test-control-panel>
    </main>
  </body>
</html>
