<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editorial section anonymous content wrapper C.5</title>
    <style>
      body { font: 16px/1.4 Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      test-page-segment,
      test-content-block,
      test-copy-shell,
      test-control-panel { display: block; }
      .controls { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main
      data-sr-scan-root
      data-sr-fixture-id="ba-residual-groups-c5/editorial-section-anonymous-content-wrapper"
      data-sr-fixture-status="fixture-ready-awaiting-push"
    >
      <test-page-segment data-contract="editorial-section-anonymous-content-wrapper">
        <test-content-block>
          <h1>Entertainment</h1>
          <test-copy-shell>
            <p>Browse short guides, saved media, and support links.</p>
            <p><a href="#wifi">Connection help</a> is available before travel.</p>
          </test-copy-shell>
        </test-content-block>

        <test-content-block>
          <h2>More choices</h2>
          <test-copy-shell>
            <p>Choose a guide for your trip.</p>
          </test-copy-shell>
        </test-content-block>
      </test-page-segment>

      <test-control-panel class="controls">
        <div role="group" aria-label="Named control group">
          <button type="button">Named control</button>
        </div>
        <div role="group">
          <button type="button">Ordinary control</button>
        </div>
      </test-control-panel>
