<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media video content wrapper C.5</title>
    <style>
      body { font: 16px/1.4 Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      test-page-segment,
      test-media-shell,
      test-player-shell,
      test-control-panel { display: block; }
      img, video { display: block; width: 240px; height: 135px; margin: 8px 0; }
      .controls { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main
      data-sr-scan-root
      data-sr-fixture-id="ba-residual-groups-c5/media-video-content-wrapper"
      data-sr-fixture-status="fixture-ready-awaiting-push"
    >
      <test-page-segment data-contract="media-video-content-wrapper">
        <h1>Room guide</h1>
        <p>Review the preview before choosing options.</p>

        <test-media-shell>
          <img alt="Room preview">
          <test-player-shell>
            <video controls aria-label="Room video"></video>
            <button type="button" aria-label="Play room video">Play</button>
          </test-player-shell>
        </test-media-shell>
      </test-page-segment>

      <test-control-panel class="controls">
        <div role="group" aria-label="Named control group">
          <button type="button">Named control</button>
        </div>
        <div role="group">
          <button type="button">Ordinary control</button>
        </div>
      </test-control-panel>
    </main>
  </body>
</html>
