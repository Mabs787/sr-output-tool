<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resources list marker formatting repro</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        line-height: 1.45;
      }

      main {
        padding: 24px;
      }

      .resource-panel {
        max-width: 720px;
      }

      section {
        margin: 0 0 24px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }

      h2 span {
        display: inline;
      }

      ul {
        margin: 0;
      }

      li {
        list-style-type: disc;
      }
    </style>
  </head>

    <main data-sr-scan-root>
      <div class="resource-panel" data-sr-dom-node-id="174">

            </h2>

            <li data-sr-dom-node-id="181" data-sr-marker-content="normal" data-sr-marker-display="inline-block" data-sr-marker-list-style-type="disc">

            </li>
