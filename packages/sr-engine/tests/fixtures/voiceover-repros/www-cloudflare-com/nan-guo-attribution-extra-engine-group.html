<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloudflare Nan Guo attribution wrapper C.5</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      .quote-card { border: 1px solid #aaa; padding: 16px; }
      .person { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
      img { width: 56px; height: 56px; border-radius: 50%; background: #ddd; }
      .attribution { display: flex; flex-direction: column; }
      .name { font-weight: 700; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft" tabindex="-1">
      <section class="quote-card">
        <h2>Customer result</h2>
        <p>Teams can ship faster with simpler infrastructure.</p>
        <div class="person">
          <img alt="Nan Guo">
          <div class="attribution">
            <span class="name">Nan Guo</span>
            <span>Senior Vice President of Engineering</span>
          </div>
        </div>
      </section>
      <section>
        <h3>Powerful primitives, seamlessly integrated</h3>
        <p>Use storage and compute together.</p>
      </section>
    </main>
  </body>
</html>
