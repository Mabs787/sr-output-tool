<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloudflare header contact sales group C.5</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; }
      [data-sr-scan-root] { min-height: 100vh; }
      header { border-bottom: 1px solid #bbb; }
      .bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; height: 72px; padding: 0 20px; }
      .logo { display: inline-flex; align-items: center; gap: 8px; }
      nav, .actions, .primary-action { display: flex; align-items: center; gap: 12px; }
      a { color: #111; text-decoration: none; }
      .button-link { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 12px; border: 1px solid #777; border-radius: 999px; }
      .hidden-mobile { display: none; }
      astro-island { display: inline; }
      main { padding: 24px; }
    </style>
  </head>
  <body>
    <div data-sr-scan-root data-sr-fixture-status="draft">
      <header>
        <div class="bar">
          <a class="logo" href="/" aria-label="Cloudflare logo">
            <svg width="24" height="16" aria-hidden="true"></svg>
            <svg width="92" height="14" role="img" aria-label="Cloudflare wordmark"></svg>
          </a>

          <nav aria-label="Main navigation">
            <div>
              <a href="/products/" aria-haspopup="true" aria-expanded="false">Products<svg aria-hidden="true" width="8" height="8"></svg></a>
              <a href="/solutions/" aria-haspopup="true" aria-expanded="false">Solutions<svg aria-hidden="true" width="8" height="8"></svg></a>
              <a href="/resource-hub/" aria-haspopup="true" aria-expanded="false">Resources<svg aria-hidden="true" width="8" height="8"></svg></a>
              <a href="/plans/">Pricing</a>
            </div>
          </nav>

          <div>
            <div class="actions">
              <a href="https://dash.cloudflare.com/login">Login</a>
              <a id="nav-contact-sales-button" class="button-link" href="/resource/contact-enterprise-sales/" data-slot="button">Contact sales</a>
            </div>
            <div class="primary-action">
              <a href="https://dash.cloudflare.com/sign-up" tabindex="-1" aria-hidden="true">Start building</a>
              <astro-island>
                <div style="display: none;">
                  <a href="https://dash.cloudflare.com/login">Login</a>
                </div>
                <button style="display: none;" type="button" aria-expanded="false" aria-label="Open menu">
                  <span aria-hidden="true"><span><svg aria-hidden="true"></svg></span><span><svg aria-hidden="true"></svg></span></span>
                </button>
              </astro-island>
            </div>
          </div>
        </div>
      </header>
      <main tabindex="-1">
        <h1>After banner</h1>
      </main>
    </div>
  </body>
</html>
