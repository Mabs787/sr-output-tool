<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batch 4 C.5 - Shopify per-word heading fragmentation</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 820px; }
      nav { display: flex; gap: 8px; margin-bottom: 16px; }
      blockquote { margin: 0; }
      h3 span span { display: inline-block; margin-right: 0.25em; }
      .quote-mark { color: #555; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <section aria-label="Customer stories">
        <nav aria-label="Customer story tabs">
          <button type="button" aria-controls="batch-4-customer-story-panel" aria-label="Currently showing the Shopify customer story">Shopify</button>
          <button type="button" aria-controls="batch-4-customer-story-panel" aria-label="Show the Intercom customer story">Intercom</button>
          <button type="button" aria-controls="batch-4-customer-story-panel" aria-label="Show the DoorDash customer story">DoorDash</button>
        </nav>
        <section id="batch-4-customer-story-panel" aria-roledescription="slide" aria-label="Story: Shopify" aria-live="polite" aria-atomic="true">
          <button type="button" aria-pressed="true" aria-label="Resume customer story and logo rotation">Play</button>
          <blockquote>
            <h3>
              <span aria-hidden="true" class="quote-mark">&ldquo;</span><span><span>For</span><span>Shopify,</span><span>the</span><span>real</span><span>challenge</span><span>is</span><span>not</span><span>about</span><span>how</span><span>many</span><span>different</span><span>pieces</span><span>of</span><span>complex</span><span>technology</span><span>we</span><span>can</span><span>use</span><span>but</span><span>the</span><span>opposite.</span><span>Cloudflare</span><span>helps</span><span>us</span><span>find</span><span>a</span><span>simple</span><span>way</span><span>to</span><span>achieve</span><span>something</span><span>very</span><span>complex</span><span>that</span><span>we</span><span>can</span><span>scale</span><span>and</span><span>maintain.</span></span><span aria-hidden="true" class="quote-mark">&rdquo;</span>
            </h3>
          </blockquote>
        </section>
      </section>
    </main>
  </body>
</html>
