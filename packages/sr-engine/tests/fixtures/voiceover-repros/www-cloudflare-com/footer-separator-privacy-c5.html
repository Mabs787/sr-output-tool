<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloudflare footer separator and privacy button C.5</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 760px; }
      footer { border-top: 1px solid #777; padding-top: 16px; }
      .legal { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .separator { color: #555; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>Footer separator and privacy button</h1>
      <footer>
        <nav aria-label="Legal">
          <div class="legal">
            <a href="#privacy">Privacy Policy</a>
            <span class="separator">|</span>
            <a href="#terms">Terms of Use</a>
            <span class="separator">|</span>
            <a href="#trust">Trust and Safety</a>
            <span class="separator">|</span>
            <button type="button" class="privacy-button">
              <svg role="img" aria-hidden="true" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="6"></circle>
              </svg>
              <span>Your privacy choices</span>
            </button>
          </div>
        </nav>
      </footer>
    </main>
  </body>
</html>
