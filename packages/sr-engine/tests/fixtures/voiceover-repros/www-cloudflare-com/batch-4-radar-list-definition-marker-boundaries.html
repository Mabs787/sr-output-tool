<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batch 4 Radar list and definition marker boundaries C.5</title>
    <style>
      body {
        color: #111;
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      [data-sr-scan-root] {
        max-width: 760px;
      }

      article {
        margin-block-end: 28px;
      }

      dl > div {
        display: grid;
        gap: 6px;
        grid-template-columns: 8rem 1fr;
      }

      .offscreen {
        left: -10000px;
        position: absolute;
        top: auto;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="phase-c5-draft">
      <article aria-labelledby="top-tlds-heading">
        <h2 id="top-tlds-heading"><a href="/domains">Top 10 TLDs</a></h2>
        <p>Top domains based on resolver traffic.</p>
        <ol data-source-dom-node-id="1620" data-source-ax-node-id="2433900">
          <li data-source-dom-node-id="1621" data-source-ax-node-id="2433890"><a href="/domains/com">.com</a></li>
          <li><a href="/domains/net">.net</a></li>
          <li><a href="/domains/org">.org</a></li>
          <li>example</li>
          <li><a href="/domains/arpa">.arpa</a></li>
          <li><a href="/domains/dev">.dev</a></li>
          <li><a href="/domains/google">google</a></li>
          <li><a href="/domains/cn">.cn</a></li>
          <li><a href="/domains/co">.co</a></li>
          <li><a href="/domains/tv">.tv</a></li>
        </ol>
      </article>

      <article aria-labelledby="outage-heading">
        <h2 id="outage-heading"><a href="/outage-center">Last observed outage<span>worldwide</span></a></h2>
        <p>Internet disruptions observed in Cloudflare traffic.</p>
        <figure>
          <dl data-source-dom-node-id="1972" data-source-ax-node-id="1297457">
            <div data-source-dom-node-id="1973">
              <dt data-source-dom-node-id="1974" data-source-ax-node-id="1297434">Location</dt>
              <dd data-source-dom-node-id="1975" data-source-ax-node-id="1297435"><a href="/lc" data-source-dom-node-id="1976" data-source-ax-node-id="1297433">Saint Lucia</a></dd>
            </div>
            <div data-source-dom-node-id="1977">
              <dt data-source-dom-node-id="1978" data-source-ax-node-id="1297436">ASN</dt>
              <dd data-source-dom-node-id="1979" data-source-ax-node-id="1297437">-</dd>
            </div>
            <div class="offscreen" data-sr-rendered-position="offscreen">
              <dt>Type</dt>
              <dd>Nationwide</dd>
            </div>
            <div class="offscreen" data-sr-rendered-position="offscreen">
              <dt>Cause</dt>
              <dd>Power outage</dd>
            </div>
          </dl>
        </figure>
      </article>
    </main>
  </body>
</html>
