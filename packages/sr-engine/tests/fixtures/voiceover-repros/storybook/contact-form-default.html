<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Storybook contact form default repro</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 32px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 420px;
      }
      h2 {
        font-size: 18px;
        margin: 0;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      label {
        color: #111;
        font-size: 13px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        border: 1.5px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 14px;
        padding: 8px 10px;
        width: 100%;
      }
      button {
        align-self: flex-start;
        background: #0070f3;
        border: 0;
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <form aria-label="Contact us" data-sr-scan-root>
      <h2>Contact us</h2>

      <div class="field">
        <label for="cf-name">Name <span aria-hidden="true">*</span></label>
        <input
          id="cf-name"
          type="text"
          autocomplete="name"
          required
          aria-required="true"
          placeholder="Jane Smith"
        />
      </div>

      <div class="field">
        <label for="cf-email">Email <span aria-hidden="true">*</span></label>
        <input
          id="cf-email"
          type="email"
          autocomplete="email"
          required
          aria-required="true"
          placeholder="jane@example.com"
        />
      </div>

      <div class="field">
        <label for="cf-subject">Subject</label>
        <select id="cf-subject">
          <option value="">Choose a topic</option>
          <option value="support">Support</option>
          <option value="billing">Billing</option>
          <option value="feedback">Feedback</option>
        </select>
      </div>

      <div class="field">
        <label for="cf-message">Message <span aria-hidden="true">*</span></label>
        <textarea
          id="cf-message"
          rows="4"
          required
          aria-required="true"
          placeholder="Your message..."
        ></textarea>
      </div>

      <button type="submit">Send message</button>
    </form>
  </body>
</html>
