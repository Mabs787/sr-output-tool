<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generic logo and social link C.5</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.4;
        margin: 24px;
      }

      .visually-hidden {
        border: 0;
        clip: rect(0 0 0 0);
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      [data-sr-scan-root] {
        display: grid;
        gap: 24px;
        max-width: 520px;
      }

      nav ul {
        display: flex;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      a[aria-label] {
        display: inline-flex;
        min-height: 32px;
        min-width: 32px;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root aria-label="Generic logo and social link C.5 root">
      <p>Generic logo social C.5 identity marker.</p>

      <header aria-label="Logo probe">
        <a href="#home" aria-label="Example Logo" data-probe="linked-logo">
          <svg role="img" aria-labelledby="example-logo-title" width="96" height="24" viewBox="0 0 96 24" focusable="false">
            <title id="example-logo-title">Example Logo</title>
            <rect width="96" height="24" fill="#1f2937"></rect>
            <text x="8" y="16" font-family="Arial" font-size="12" fill="#ffffff">Example</text>
          </svg>
          <span class="visually-hidden">Example Logo</span>
        </a>
      </header>

      <nav aria-label="Social links">
        <ul>
          <li><a href="#alpha" aria-label="Alpha" data-probe="social-1"></a></li>
          <li><a href="#beta" aria-label="Beta" data-probe="social-2"></a></li>
          <li><a href="#gamma" aria-label="Gamma" data-probe="social-3"></a></li>
          <li><a href="#delta" aria-label="Delta" data-probe="social-4"></a></li>
          <li><a href="#x" aria-label="X" data-probe="social-x"></a></li>
          <li><a href="#zeta" aria-label="Zeta" data-probe="social-6"></a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
