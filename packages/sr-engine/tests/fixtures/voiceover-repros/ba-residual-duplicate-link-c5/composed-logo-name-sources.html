<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Composed logo name sources C.5</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.4;
        margin: 24px;
      }

      .visually-hidden-text {
        border: 0 !important;
        clip: rect(0 0 0 0) !important;
        clip-path: inset(50%) !important;
        height: 1px !important;
        margin: 0 !important;
        overflow: hidden !important;
        padding: 0 !important;
        position: absolute !important;
        white-space: nowrap !important;
        width: 1px !important;
      }

      [data-sr-scan-root] {
        display: grid;
        gap: 24px;
        max-width: 520px;
      }

      header,
      footer {
        display: grid;
        gap: 12px;
      }

      nav {
        display: flex;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft" aria-label="Composed logo name sources C.5 root">
      <p>Duplicate link accessible-name composition C.5 identity.</p>

      <header aria-label="Header logo source contract">
        <button>Jump to content</button>
        <x-logo-link data-contract="positive-identical-svg-title-plus-hidden-text">
          <template shadowrootmode="open">
            <style>
              a {
                align-items: center;
                display: inline-flex;
                min-height: 32px;
              }

              .visually-hidden-text {
                border: 0 !important;
                clip: rect(0 0 0 0) !important;
                clip-path: inset(50%) !important;
                height: 1px !important;
                margin: 0 !important;
                overflow: hidden !important;
                padding: 0 !important;
                position: absolute !important;
                white-space: nowrap !important;
                width: 1px !important;
              }
            </style>
            <a href="#home">
              <svg role="img" aria-labelledby="header-mark-title" focusable="false" width="64" height="24" viewBox="0 0 64 24">
                <title id="header-mark-title">Aster Mark</title>
                <rect width="64" height="24"></rect>
              </svg>
              <span class="visually-hidden-text">Aster Mark</span>
            </a>
          </template>
        </x-logo-link>
        <x-logo-link style="display: none" data-contract="hidden-responsive-logo-clone">
          <template shadowrootmode="open">
            <a href="#hidden-home">
              <svg role="img" aria-labelledby="hidden-mark-title" focusable="false" width="32" height="24" viewBox="0 0 32 24">
                <title id="hidden-mark-title">Aster Badge</title>
                <rect width="32" height="24"></rect>
              </svg>
              <span class="visually-hidden-text">Aster Mark</span>
            </a>
          </template>
        </x-logo-link>
        <nav aria-label="Main">
          <a href="#partner">Orbit</a>
          <a href="#find">Find</a>
          <a href="#account">Account</a>

      </header>

      <footer aria-label="Footer logo source contract">

        <a href="#privacy">Privacy</a>
        <x-logo-link data-contract="positive-different-svg-title-plus-hidden-text">
          <template shadowrootmode="open">
            <style>
              a {
                align-items: center;
                display: inline-flex;
                min-height: 32px;
              }

              .visually-hidden-text {
                border: 0 !important;
                clip: rect(0 0 0 0) !important;
                clip-path: inset(50%) !important;

                margin: 0 !important;

            <a href="#footer-home">

              </svg>
              <span class="visually-hidden-text">Aster Mark</span>

        <ul aria-label="Social links">
          <li><a href="#alpha" aria-label="Alpha"></a></li>
          <li><a href="#beta" aria-label="Beta"></a></li>

</html>
