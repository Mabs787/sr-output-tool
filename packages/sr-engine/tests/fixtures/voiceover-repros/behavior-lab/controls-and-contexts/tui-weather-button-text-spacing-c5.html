<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TUI weather split button text C5</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 520px; }
      button { border: 1px solid #6f7d8c; border-radius: 999px; background: white; font: inherit; padding: 10px 14px; }
      button span { display: block; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>TUI weather split button text</h1>
      <div class="title">Weather</div>
      <button type="button" class="button-component warm">
        <span class="title">Warm</span>
        <span class="subtitle">16 - 22ºC</span>
      </button>
      <button type="button" class="button-component hot">
        <span class="title">Hot</span>
        <span class="subtitle">23 - 28ºC</span>
      </button>
    </main>
  </body>
</html>
