<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidden custom tooltip behavior lab</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      button { font: inherit; padding: 8px 12px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root>
      <h1>Hidden custom tooltip</h1>
      <x-icon-button>
        <button aria-label="Settings">
          <span aria-hidden="true">
            <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"></circle></svg>
          </span>
        </button>
        <x-tooltip role="tooltip" tabindex="-1" aria-label="tooltip">
          <span class="hidden">Settings</span>
        </x-tooltip>
      </x-icon-button>
    </main>
  </body>
</html>
