<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grouped control wrapper boundaries behavior lab</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { display: grid; gap: 20px; max-width: 760px; }
      section { border: 1px solid #ccc; padding: 16px; }
      button, a { font: inherit; margin: 4px; padding: 8px 12px; }
      .visual { display: inline-flex; gap: 4px; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>Grouped control wrapper boundaries</h1>

      <section aria-labelledby="plain-wrapper-heading">
        <h2 id="plain-wrapper-heading">Plain wrapper around labeled button</h2>
        <div>
          <button aria-label="Guide">
            <span aria-hidden="true" class="visual">Menu</span>
          </button>
        </div>
      </section>

      <section aria-labelledby="role-group-heading">
        <h2 id="role-group-heading">Role group around labeled button</h2>
        <div role="group" aria-label="Header controls">
          <button aria-label="Skip navigation">
            <span aria-hidden="true">Skip</span>
          </button>
        </div>
      </section>

      <section aria-labelledby="custom-element-heading">
        <h2 id="custom-element-heading">Custom element wrapper around link button</h2>
        <x-button-renderer>
          <x-button-shape>
            <a href="/signin" aria-label="Sign in">
              <span aria-hidden="true">Person icon</span>
              <span>Sign in</span>
            </a>
          </x-button-shape>
        </x-button-renderer>
      </section>

      <section aria-labelledby="focusable-wrapper-heading">
        <h2 id="focusable-wrapper-heading">Focusable wrapper with child control</h2>
        <div role="group" tabindex="0" aria-label="Recommendation card">
          <a href="/watch">Watch now</a>
          <button aria-label="More actions">More</button>
        </div>
      </section>
    </main>
  </body>
</html>
