<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opacity zero skip link C5</title>
    <style>
      .skip-link {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text" aria-atomic="false"></section>
      <a class="skip-link" href="#content">Skip to content →</a>
      <header>
        <nav aria-label="Main">
          <ul aria-label="Site navigation">
            <li><a href="/home" aria-label="Navigate to home">Home</a></li>
            <li><a href="/pricing">Pricing</a></li>
          </ul>
        </nav>
      </header>
      <div id="content">
        <h1>Security</h1>
        <p>Everything in this example is designed to keep work safe and secure.</p>
      </div>
    </main>
  </body>
</html>
