<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unnamed modal dialog behavior lab</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 720px; }
      [role="dialog"] { border: 2px solid #555; padding: 16px; }
      button, a { font: inherit; margin: 4px; padding: 8px 12px; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <div role="dialog" aria-modal="true">
        <button type="button" aria-label="Back">Back</button>
        <a href="/orders">Orders</a>
        <a href="/account">Account</a>
      </div>
    </main>
  </body>
</html>
