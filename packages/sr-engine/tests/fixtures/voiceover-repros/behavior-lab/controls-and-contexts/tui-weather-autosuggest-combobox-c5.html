<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TUI weather autosuggest combobox C5</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 520px; }
      input { border: 1px solid #6f7d8c; border-radius: 6px; font: inherit; padding: 10px 12px; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>TUI weather autosuggest combobox</h1>
      <div class="group-component">
        <div class="title">Where</div>
        <div class="row">
          <div
            role="combobox"
            aria-haspopup="listbox"
            aria-owns="react-autowhatever-1"
            aria-expanded="false"
            class="react-autosuggest__container"
          >
            <input
              type="text"
              autocomplete="off"
              aria-autocomplete="list"
              aria-controls="react-autowhatever-1"
              class="react-autosuggest__input"
              placeholder="Anywhere"
            >
            <div id="react-autowhatever-1" role="listbox" class="react-autosuggest__suggestions-container"></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
