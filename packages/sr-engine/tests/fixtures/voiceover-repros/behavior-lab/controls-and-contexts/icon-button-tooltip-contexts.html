<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Icon button tooltip contexts behavior lab</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { display: grid; gap: 20px; max-width: 720px; }
      section { border: 1px solid #ccc; padding: 16px; }
      button, a { font: inherit; margin: 4px; padding: 8px 12px; }
      svg { width: 1em; height: 1em; }
      [role="tooltip"] { border: 1px solid #777; padding: 4px 8px; width: max-content; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>Icon button tooltip contexts</h1>

      <section aria-labelledby="native-label-only-heading">
        <h2 id="native-label-only-heading">Native icon button with label only</h2>
        <button aria-label="Open menu">
          <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"></path></svg>
        </button>
      </section>

      <section aria-labelledby="associated-tooltip-heading">
        <h2 id="associated-tooltip-heading">Associated tooltip</h2>
        <button aria-label="Search with your voice" aria-describedby="voice-tip">
          <svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="6" r="3"></circle></svg>
        </button>
        <div id="voice-tip" role="tooltip">Search with your voice</div>
      </section>

      <section aria-labelledby="custom-wrapper-heading">
        <h2 id="custom-wrapper-heading">Custom wrapper with nested tooltip</h2>
        <x-icon-button>
          <button aria-label="Settings">
            <span aria-hidden="true">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"></circle></svg>
            </span>
          </button>
          <x-tooltip role="tooltip" tabindex="-1" aria-label="tooltip">
            <span class="hidden">Settings</span>
          </x-tooltip>
        </x-icon-button>
      </section>

      <section aria-labelledby="visible-text-heading">
        <h2 id="visible-text-heading">Icon button with visible text</h2>
        <button>
          <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 3h10v10H3z"></path></svg>
          Sign in
        </button>
      </section>
    </main>
  </body>
</html>
