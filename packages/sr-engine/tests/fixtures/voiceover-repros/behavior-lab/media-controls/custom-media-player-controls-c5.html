<!doctype html>
<html lang="en" data-sr-fixture-status="draft">
  <head>
    <meta charset="utf-8">
    <title>Custom media player controls C5</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 32px;
      }

      .player {
        border: 1px solid #999;
        border-radius: 8px;
        max-width: 720px;
        padding: 16px;
      }

      .poster {
        align-items: center;
        background: #111;
        color: white;
        display: flex;
        height: 220px;
        justify-content: center;
      }

      .controls {
        align-items: center;
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      .sound {
        align-items: center;
        display: flex;
        gap: 8px;
      }

      .sr-only {
        border: 0;
        clip: rect(0 0 0 0);
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root>
      <h1>Custom media player controls</h1>
      <p>This fixture isolates a focusable labeled media-player region with custom controls.</p>

      <div class="player" role="region" aria-label="Media player" tabindex="0" data-status="paused">
        <div class="poster">
          <svg width="80" height="80" viewBox="0 0 80 80" aria-label="Linear logo" role="img">
            <rect width="80" height="80" fill="currentColor"></rect>
          </svg>
        </div>

        <div class="controls">
          <button type="button" aria-label="Play (keyboard shortcut k)" aria-keyshortcuts="k">Play</button>

          <div class="sound">
            <button type="button" aria-label="Mute (keyboard shortcut m)" aria-keyshortcuts="m">Mute</button>
            <div
              tabindex="0"
              role="slider"
              aria-valuemin="0"
              aria-valuenow="100"
              aria-valuemax="100"
              aria-valuetext="100% volume"
              aria-label="Volume"
              aria-orientation="vertical"
            >
              Volume
            </div>
          </div>

          <time datetime="PT0S" role="timer"><span class="sr-only">Elapsed</span>00:00</time>

          <div
            tabindex="0"
            role="slider"
            aria-valuemin="0"
            aria-valuenow="0"
            aria-valuemax="1"
            aria-valuetext="0 seconds of 3 minutes 18 seconds"
            aria-label="Seek slider"
          >
            Seek to: 00:00 / Duration 03:18
          </div>

          <span><span class="sr-only">Remaining</span>03:18</span>
          <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Change playback rate (keyboard shortcut > or <)">1x</button>
          <button type="button" aria-label="Picture-in-Picture (keyboard shortcut p)">Picture-in-Picture</button>
          <button type="button" aria-label="Full screen (keyboard shortcut f)">Full screen</button>
        </div>
      </div>

      <p>After media player</p>
    </main>
  </body>
</html>
