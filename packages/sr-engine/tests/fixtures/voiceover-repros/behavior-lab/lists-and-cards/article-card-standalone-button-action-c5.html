<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Article card standalone button action C5</title>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>Article card standalone button action</h1>
      <p>
        This fixture isolates whether VoiceOver adds a group suffix to a standalone button action inside a structured article card.
      </p>
      <section aria-label="Contact cards">
        <article>
          <h4>General communication</h4>
          <p>For other questions, email us</p>
          <div>
            <button type="button">
              <span>
                <span>hello@example.com</span><span>+</span>
              </span>
            </button>
          </div>
        </article>
        <article>
          <h4>Documentation</h4>
          <p>Read setup guides and reference docs</p>
          <div>
            <a href="/docs">
              <span>
                <span>Docs</span><span>→</span>
              </span>
            </a>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
