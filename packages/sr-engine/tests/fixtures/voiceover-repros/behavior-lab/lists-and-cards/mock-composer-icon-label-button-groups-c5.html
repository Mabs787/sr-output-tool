<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mock composer icon label button groups C.5</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { max-width: 760px; }
      .mockup { border: 1px solid #777; border-radius: 16px; padding: 16px; }
      .composer { border: 1px solid #aaa; border-radius: 12px; margin: 12px 0; padding: 10px; }
      .prompt { display: flex; gap: 4px; margin-bottom: 8px; }
      .actions { display: flex; align-items: center; justify-content: space-between; }
      .cluster { display: flex; gap: 6px; }
      button { align-items: center; background: white; border: 1px solid #999; border-radius: 8px; display: inline-flex; height: 32px; justify-content: center; width: 32px; }
      svg { height: 14px; width: 14px; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-fixture-status="draft">
      <h1>Mock composer icon label button groups</h1>
      <p>This fixture isolates whether VoiceOver appends group to aria-label icon-only composer buttons inside repeated visual mockups.</p>
      <section class="mockup" aria-label="Agent composer examples">
        <div class="composer">
          <div class="prompt"><span>@Linear</span><span>create new issue and delegate to Cursor</span></div>
          <div class="actions">
            <button aria-label="Attach" tabindex="-1"><svg></svg></button>
            <div class="cluster">
              <button aria-label="Format text" tabindex="-1"><svg></svg></button>
              <button aria-label="Emoji" tabindex="-1"><svg></svg></button>
              <button aria-label="Mention" tabindex="-1"><svg></svg></button>
            </div>
            <div class="cluster">
              <button aria-label="Send" tabindex="-1"><svg></svg></button>
              <button aria-label="More options" tabindex="-1"><svg></svg></button>
            </div>
          </div>
        </div>
        <div class="composer">
          <div class="prompt"><span>@Linear</span><span>assign to Alex and delegate to Copilot</span></div>
          <div class="actions">
            <button aria-label="Attach" tabindex="-1"><svg></svg></button>
            <div class="cluster">
              <button aria-label="Format text" tabindex="-1"><svg></svg></button>
              <button aria-label="Emoji" tabindex="-1"><svg></svg></button>
              <button aria-label="Mention" tabindex="-1"><svg></svg></button>
            </div>
            <div class="cluster">
              <button aria-label="Send" tabindex="-1"><svg></svg></button>
              <button aria-label="More options" tabindex="-1"><svg></svg></button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
