<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase C.5 empty heading media boundary repro</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      [data-sr-scan-root] { display: grid; gap: 18px; max-width: 760px; }
      section { border: 1px solid #ccc; padding: 14px; }
      img { display: block; width: 220px; height: 124px; background: #ddd; }
      .hidden-heading { display: none; }
    </style>
  </head>
  <body>
    <main data-sr-scan-root data-sr-repro-family="empty-heading-media-boundary">
      <h1>Empty heading media marker</h1>

      <section aria-labelledby="primary-card-heading">
        <h2 id="primary-card-heading">Primary card</h2>
        <div>
          <x-content>
            <template shadowrootmode="open">
              <slot></slot>
            </template>
            <h2></h2>
          </x-content>
        </div>
        <article>
          <img
            alt="Service desk"
            src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='220'%20height='124'%3E%3Crect%20width='220'%20height='124'%20fill='%23ddd'/%3E%3C/svg%3E">
          <h3>Help desk</h3>
          <p>Short support copy.</p>
        </article>
      </section>

      <section aria-labelledby="negative-heading">
        <h2 id="negative-heading">Negative controls</h2>
        <h2>Visible media heading</h2>
        <img
          alt="Gate display"
          src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='220'%20height='124'%3E%3Crect%20width='220'%20height='124'%20fill='%23ddd'/%3E%3C/svg%3E">
        <h2 class="hidden-heading">Hidden empty heading</h2>
        <p>Text after hidden heading.</p>
      </section>
    </main>
  </body>
</html>
