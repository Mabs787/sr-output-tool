<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Minimal reproduction: feature row text join</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      .feature-section {
        margin: 24px 0;
      }

      .feature-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0;
      }

      .feature-row img {
        width: 24px;
        height: 24px;
      }
    </style>
  </head>
  <body>
    <main data-sr-scan-root>
      <div data-sr-dom-node-id="480" data-sr-rendered-position="offscreen" class="feature-section">
        <div data-sr-dom-node-id="481" data-sr-rendered-position="offscreen">
          <h2 data-sr-dom-node-id="482" data-sr-rendered-position="offscreen">We've got you covered</h2>
          <div data-sr-dom-node-id="483" data-sr-rendered-position="offscreen">
            <div data-sr-dom-node-id="484" data-sr-rendered-position="offscreen" class="feature-row">
              <img alt="" role="presentation" data-sr-dom-node-id="485" data-sr-rendered-position="offscreen">
              <span data-sr-dom-node-id="486" data-sr-rendered-position="offscreen">Start claims in My Sky App</span>
            </div>
            <div data-sr-dom-node-id="487" data-sr-rendered-position="offscreen" class="feature-row">
              <img alt="" role="presentation" data-sr-dom-node-id="488" data-sr-rendered-position="offscreen">
              <span data-sr-dom-node-id="489" data-sr-rendered-position="offscreen">UK based support team</span>
            </div>
            <div data-sr-dom-node-id="490" data-sr-rendered-position="offscreen" class="feature-row">
              <img alt="" role="presentation" data-sr-dom-node-id="491" data-sr-rendered-position="offscreen">
              <span data-sr-dom-node-id="492" data-sr-rendered-position="offscreen">24 hour claims support</span>
            </div>
          </div>
        </div>
      </div>
      <h2 data-sr-dom-node-id="496" data-sr-rendered-position="offscreen">Keep the drama on the screen</h2>
    </main>
  </body>
</html>
