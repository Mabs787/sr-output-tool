<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VoiceOver C.5 - login password and social button grouping</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px; }
    main { max-width: 360px; margin: 0 auto; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; }
    label { margin-top: 16px; font-weight: 600; }
    input, button { margin-top: 8px; padding: 10px 12px; }
    .password-row { position: relative; }
    .forgot { position: absolute; right: 0; top: 0; }
    .separator { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
    .separator::before, .separator::after { content: ""; flex: 1; border-top: 1px solid #d0d7de; }
    .social button span { display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  </style>
</head>
<body>
  <main data-sr-scan-root data-sr-fixture-status="draft">
    <h1>Sign in to example</h1>
    <form action="#" method="post">
      <label for="login_field">Username or email address</label>
      <input id="login_field" name="login" type="text" required>

      <div class="password-row">
        <label for="password">Password</label>
        <a class="forgot" href="#forgot">Forgot password?</a>
        <input id="password" name="password" type="password" required>
      </div>

      <input type="submit" name="commit" value="Sign in">
    </form>

    <div class="separator"><span>or</span></div>

    <form class="social" action="#google" method="post">
      <button type="submit"><span><svg aria-hidden="true" width="16" height="16"></svg><span>Continue with Google</span></span></button>
    </form>

    <form class="social" action="#apple" method="post">
      <button type="submit"><span><svg aria-hidden="true" width="16" height="16"></svg><span>Continue with Apple</span></span></button>
    </form>
  </main>
</body>
</html>
