<body><form aria-label="Contact us" data-sr-scan-root=""><h2>Contact us</h2><div><label for="cf-name">Name <span aria-hidden="true">*</span></label><input id="cf-name" type="text" required="" aria-required="true" placeholder="Jane Smith"></div><div><label for="cf-email">Email <span aria-hidden="true">*</span></label><input id="cf-email" type="email" required="" aria-required="true" placeholder="jane@example.com"></div><div><label for="cf-subject">Subject</label><select id="cf-subject"><option value="">Choose a topic</option><option value="support">Support</option><option value="billing">Billing</option><option value="feedback">Feedback</option></select></div><div><label for="cf-message">Message <span aria-hidden="true">*</span></label><textarea id="cf-message" required="" aria-required="true" placeholder="Your message..."></textarea></div><button type="submit">Send message</button></form></body>
