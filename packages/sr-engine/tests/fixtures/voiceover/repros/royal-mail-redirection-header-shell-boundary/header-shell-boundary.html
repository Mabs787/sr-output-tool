<!doctype html>

    <title>Header shell boundary C.5</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
        margin: 0;
      }

      [data-sr-scan-root] {
        min-height: 240px;
      }

      .visually-hidden {
        border: 0;
        clip: rect(0 0 0 0);
        height: 1px;
        margin: -1px;
        overflow: hidden;
        padding: 0;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }

      header[role="banner"] {
        background: #f4f4f4;
        min-height: 134px;
      }

      .top-row {
        align-items: center;
        display: flex;
        gap: 24px;
        height: 64px;
        padding-inline: 38px;
      }

      .primary-menu,
      .send-menu {
        display: block;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .send-menu ul {
        display: block;
      }

      .send-menu a {
        display: inline;
      }

      .secondary-shell {
        padding-inline: 38px;
      }

      .secondary-current {
        display: flex;
        height: 56px;
      }

      .secondary-links {
        display: -webkit-box;
      }

      .secondary-current a,
      .secondary-links a {
        align-items: center;
        color: #111;
        display: flex;
        min-height: 30px;
        padding-inline: 10px;
        text-decoration: underline;
      }

      .secondary-current > a {
        display: block;
        padding-block: 8px;
      }

      .secondary-links a[aria-current="page"] {
        display: table;
      }

      .icon-holder {
        display: none;
      }

      main[role="main"] {
        padding: 24px 38px;
      }
    </style>
  </head>
