n_x-small"><g lwc-7fsohrob56o=""><path d="M476 178L271 385c-6 6-16 6-22 0L44 178c-6-6-6-16 0-22l22-22c6-6 16-6 22 0l161 163c6 6 16 6 22 0l161-163c6-6 16-6 22 0l22 22c5 7 5 16 0 22" lwc-7fsohrob56o=""></path></g></svg></template></lightning-primitive-icon><span class="slds-assistive-text" lwc-4897l11qtae="">button icon</span></span></template></lightning-icon></button></h3><div c-bos_legalbit_bos_legalbit="" class="slds-section__content"><div class="bos-text-medium bos-text_body-lg" c-bos_legalbit_bos_legalbit=""><p class="slds-p-around_small" c-bos_legalbit_bos_legalbit="">Sky Business</p></div><div class="subHeadingClass slds-m-left_small" c-bos_legalbit_bos_legalbit=""></div><div c-bos_legalbit_bos_legalbit="" class="slds-grid slds-wrap"><div c-bos_legalbit_bos_legalbit="" class="slds-p-around_small slds-col slds-large-size_6-of-12 slds-medium-size_6-of-12 slds-size_12-of-12"><lightning-formatted-rich-text c-bos_legalbit_bos_legalbit="" class="bos-text_legal slds-rich-text-editor__output" lwc-4nfn2rc40ch-host=""><template shadowrootmode="open"><!----><span lwc-4nfn2rc40ch="" part="formatted-rich-text"><p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Broadband summer sale: </strong>Up to 20% off on broadband packages. Pay nothing upfront on 12, 24 and 36 month terms. All prices exclude VAT at 20% and may vary during contract. Part Fibre speeds up to 76/19Mbps. Standard Full Fibre speeds up to 150/28Mbps.</p>
<p lwc-4nfn2rc40ch=""><br lwc-4nfn2rc40ch=""></p>
<p lwc-4nfn2rc40ch="">Savings vs BT on Essential BBO 76mpbs and Essential BBO 150mbps ​</p>
<p lwc-4nfn2rc40ch="">​</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">SIM only Summer Sale: </strong>Pay £0 for the first 6 months, then from £11/month (ex VAT) on a 36-month min. term. 24 month terms also available. Pay £0 for the first 3 months on 12 month contracts. Excludes out-of-plan usage and add-ons.&nbsp;</p>
<p lwc-4nfn2rc40ch=""><br lwc-4nfn2rc40ch=""></p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">SIM only Roll &amp; Share your data: </strong> Unused data is stored in the Databank and automatically allocated in 1GB increments to other SIMs on the account when they run out of data. If no unused data in the Databank, SIMs on the account will receive 1GB of extra data at a cost of £5 (spend cap applies) whenever they run out, if auto top-up is enabled. May take up to 5 minutes update. Rolled-over data expires after 12 months. Available on all Data Plans (excluding Unlimited). Based on comparison with major Business Mobile Network Operators. Verified by FDM on (20/01/2026). Find out more <a href="https://www.sky.com/business/help/articles/data-roll-and-share-and-flex-features" rel="noopener noreferrer" target="_blank" lwc-4nfn2rc40ch="">here</a>.</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">&nbsp;</strong></p>
<p lwc-4nfn2rc40ch="">Calls to Sky contact centre are free for Sky Business customers with a voice line. Charges may apply if you call from a non-Sky line. Check your provider’s tariff guide. New customers only. Sky Fibre or Full Fibre areas only. Speeds ranges available dependant on location: up to 76Mbps, up to 150 Mbps, up to 300 Mbps, up to 500 Mbps, up to 900 Mbps. Prices dependant on pack and speed range chosen. Sky Business Hub is loaned to you at no cost; it must be returned at the end of the broadband subscription. Broadband and Voice and Broadband Only options available. All prices exclude VAT at 20% and may vary during contract. Stay connected guarantee: if your 4G back-up does not activate within 30 seconds of a reported broadband outage, we'll add a one-off £25 credit to your Sky Business account. New Advanced, Ultimate &amp; Ultimate Plus customers or customers taking optional 4G back-up add-on only. One claim per customer. Requires working 4G back-up with coverage connected to mains power. To claim, you must report the outage to the Sky Business Customer Service Team within 24 hours.</p>
<p lwc-4nfn2rc40ch=""><a href="https://www.sky.com/business/help/articles/sky-mobile-full-terms-and-conditions" rel="noopener noreferrer" target="_blank" lwc-4nfn2rc40ch="">Sky Business Mobile Subscription Terms and Conditions</a></p>
<p lwc-4nfn2rc40ch=""><br lwc-4nfn2rc40ch=""></p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Pay nothing upfront:</strong> Includes free postage, packaging and activation (normally £24.95 + VAT).</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Price lock guarantee: </strong>No price increase in 2026. From 1 January 2027, prices may increase during Minimum Term. Reliable Broadband: 99.99% uptime.</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">&nbsp;</strong></p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Reliable broadband:</strong> 99.99% uptime.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">30-day money back guarantee:</strong> To cancel without early termination charges, contact us within 30-days of activation. You’ll be refunded subscription payments paid (excludes upfront fees, install, add-on and usage fees).&nbsp;</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">UK-wide Coverage:</strong>&nbsp;All products and services are tailored to each client and are subject to availability and location.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Call charges:</strong>&nbsp;Calls to Sky contact centres are free for Sky Business customers with a voice line. If you don’t have a voice line with Sky Business, calls to 03 numbers cost the same as calls to 01 or 02 numbers and are included in our UK calls package if this is included with your package. If you don’t have a calls package, charges may apply, check your provider’s tariff guide.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">General - Broadband:</strong>&nbsp;Sky Fibre or Full Fibre areas only. <strong class="bos-text-medium" lwc-4nfn2rc40ch="">Speeds:</strong> varies by location – check our speed checker or call us for speed estimate. Speed ranges available dependant on location. <strong class="bos-text-medium" lwc-4nfn2rc40ch="">Term:</strong> 12, 24 and 36-month terms available. <strong class="bos-text-medium" lwc-4nfn2rc40ch="">Switching:</strong> we will manage your switch if from a provider on Openreach network. If Virgin or non-Openreach provider, you must manage and cancel your existing service once you have switched. Sky will not be liable if your existing provider fails to cancel your existing service. <strong class="bos-text-medium" lwc-4nfn2rc40ch="">Installation:</strong> Self-installation of Sky Business Hub and 4G Dongle required. Sky Business Hub is loaned to you at no cost and must be returned at the end of your business broadband subscription. £24.95 Upfront fee required. <strong class="bos-text-medium" lwc-4nfn2rc40ch="">Standard Security:</strong> includes a firewall on the router &amp; restricts access to phishing and malware-infected sites. We can’t guarantee these will detect any viruses, so we strongly recommend that you protect your business from cybercrime by using up-to-date antivirus software.</p></span><!----></template></lightning-formatted-rich-text></div><div c-bos_legalbit_bos_legalbit="" class="slds-p-around_small slds-col slds-large-size_6-of-12 slds-medium-size_6-of-12 slds-size_12-of-12"><lightning-formatted-rich-text c-bos_legalbit_bos_legalbit="" class="bos-text_legal slds-rich-text-editor__output" lwc-4nfn2rc40ch-host=""><template shadowrootmode="open"><!----><span lwc-4nfn2rc40ch="" part="formatted-rich-text"><p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Call charges:</strong>&nbsp;Calls to Sky contact centres are free for Sky Business customers with a voice line. If you don’t have a voice line with Sky Business, calls to 03 numbers cost the same as calls to 01 or 02 numbers and are included in our UK calls package if this is included with your package. If you don’t have a calls package, charges may apply, check your provider’s tariff guide.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Full Fibre Broadband:</strong>&nbsp;Sky Full Fibre areas only. Full Fibre available to 31.8% of UK businesses. Speeds vary by location. Speeds up to 75 Mbps download/19 Mbps upload; 150 Mbps download/28 Mbps upload; 300 Mbps download /47 Mbps upload; 500 Mbps download/60 Mbps upload; 900 Mbps download /85 Mbps upload with Essential, Advanced, Ultimate or Ultimate Plus full fibre broadband and voice and broadband only packages. Full Fibre is the UK’s most reliable broadband technology: based on the Ofcom UK Home Broadband Performance report (published September 2023). Up to 10x faster: a comparison of Sky Business Full Fibre with 900 Mbps vs average actual download speed of UK residential fixed broadband services (69.4Mbps; Ofcom UK Home Broadband Report, published 14 September 2023). Fibre to the Cabinet broadband (FTTC) is the standard fibre service available to the majority of the UK (circa. 96%; Connected Nations 2020: UK report (ofcom.org.uk), published 17 December 2020). <strong class="bos-text-medium" lwc-4nfn2rc40ch="">Full Fibre is the UK’s most reliable broadband technology:</strong> based on the Ofcom UK Home Broadband Performance report (published September 2023). Up to 10x faster: a comparison of Sky Business Full Fibre with 900 Mbps vs average actual download speed of UK residential fixed broadband services (69.4Mbps; Ofcom UK Home Broadband Report, published 14 September 2023). Fibre to the Cabinet broadband (FTTC) is the standard fibre service available to the majority of the UK (circa. 96%; Connected Nations 2020: UK report (ofcom.org.uk), published 17 December 2020).</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">General Voice:</strong></p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Unlimited UK calls:</strong>&nbsp;Included with Advanced, Ultimate or Ultimate Plus packs or as an optional extra for customers with Essential, includes calls to 01, 02, 03, UK mobiles and Isle of Man numbers (excludes Channel Islands, indirect access, dial-up internet &amp; 070 numbers) – subject to Sky’s Acceptable Use Policy. See our tariff guide, for details of our pay per use call charges. Premium rate numbers blocked by default. Block may be lifted via My Account. Premium rate numbers &amp; international numbers charged separately - see our tariff guide. Restrictions: in the event of a power failure or broadband outage, calls to emergency services using VOIP technology via your broadband won’t be possible (even if you have 4G backup). Compatibility: You are responsible for ensuring that security alarms or other critical business services are compatible &amp; will continue to work in an outage. Speed guarantee does not apply to 4G backup. Voice Lines: Essential, Advanced and Ultimate Broadband and Talk packs include 1 digital phone line. Ultimate Plus packs include up to 2 digital phone lines. Additional lines cost £10 (plus VAT) per month for each new line. Plus, a one-off £10 (plus VAT) activation fee, per line. Add-ons (available with both Broadband and Voice and Broadband Only packages):</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">4G Back Up:</strong>&nbsp;Requires 4G, Available with Broadband and Voice and Broadband Only packages. Included with Advanced, Ultimate and Ultimate Plus packages at no extra cost. Available as optional add on with Essential at a cost of +£12 per month.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">SecurityEdge:</strong> included at no extra cost with Ultimate and Ultimate Plus pack. Compatible router required. Available as an add-on for Essential and Advanced pack, cost +£9 month. SecurityEdge will not work if connected via a VPN or a non-Sky Business DSNS server and</p>
<p lwc-4nfn2rc40ch="">certain web filtering features will not be available on the 4G Dongle. Term: add at any time. 30-days’ prior notice required to remove SecurityEdge add-on.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Static IP:</strong>&nbsp;Included at no extra cost with Ultimate and Ultimate Plus packages. Available as an optional add on for Essential and Advanced packs at a of cost +£5.00 a month. Address is owned by Sky Business. Static IP service will not be available during a broadband outage, even if you have 4G backup. Term: add at any time. 30-days’ prior notice required to remove Static IP. Once removed, Static IP address cannot be reinstated. Should you remove then add a Static IP add-on more than once within a 12-month period, an admin charge may apply see our tariff guide.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">International calls</strong>&nbsp;(available with Broadband and voice packages only. Included for no extra cost with Ultimate Plus. Available as an optional add on for Essential, Advanced and Ultimate packages at a cost of +£12 per month): includes 500 minutes of calls to international landlines and mobiles in 48-popular destinations, after which Sky’s standard international rates apply, see our tariff guide. Calls which are not included shall be billed in arrears. Sky will pro-rate your international call allowance and fee to reflect the period you received the service. You may see an adjustment on your next monthly bill. Term: Add at any time. 30-days’ prior notice required to remove your service. If you remove then add calls pack more than once within 12-months, an admin charge may apply, see our tariff guide.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Call Divert:</strong>&nbsp;available with Broadband and voice packages only. Included for no extra cost with Ultimate and Ultimate Plus packages. Available as an optional add on for Essential and Advanced packages at a cost of + £2.50 per month. Call us on 03330 606 847 to add to your Sky package.</p>
<p lwc-4nfn2rc40ch="">&nbsp;</p>
<p lwc-4nfn2rc40ch=""><strong class="bos-text-medium" lwc-4nfn2rc40ch="">Incoming Call Management:</strong>&nbsp;available with Broadband and Voice packages only. Included for no extra cost with Ultimate Plus. Available as an optional add on for Essential, Advanced and Ultimate packages at a cost of +£2.50 per month. Call us on 03330 606 847 to add to your Sky package.</p></span><!----></template></lightning-formatted-rich-text></div></div></div></div></div></div></template></c-bos_legal-bit><c-bos-sticky-footer-broad-band-container data-sr-dom-node-id="69"><template shadowrootmode="open"><!----><c-bos-sticky-footer lwc-7dg9810mf7n-host=""><template shadowrootmode="open"><div lwc-7dg9810mf7n="" style="background: var(--Gradients-Primary-gradient, linear-gradient(90deg, #0037FF 20.45%, #0083FF 89.58%))"><div lwc-7dg9810mf7n="" class="banner-container"><div lwc-7dg9810mf7n="" class="text-container"><!----><c-bos-text-output lwc-7dg9810mf7n=""><template shadowrootmode="open"><lightning-formatted-rich-text class="bods-typography-display-5-regular bods-color-Brand-Cool-Grey slds-rich-text-editor__output" lwc-4nfn2rc40ch-host=""><template shadowrootmode="open"><!----><span lwc-4nfn2rc40ch="" part="formatted-rich-text">Ready to switch?</span><!----></template></lightning-formatted-rich-text></template></c-bos-text-output><!----></div><div lwc-7dg9810mf7n="" class="actions"><!----><!----><!----><c-bos-button lwc-7dg9810mf7n="" lwc-4scrhvvm8oi-host=""><template shadowrootmode="open"><div lwc-4scrhvvm8oi="" class="bods-button bods-button-variant-secondary"><button lwc-4scrhvvm8oi="">Check availability</button></div></template></c-bos-button><!----><!----><c-bos-button lwc-7dg9810mf7n="" lwc-4scrhvvm8oi-host=""><template shadowrootmode="open"><div lwc-4scrhvvm8oi="" class="bods-button bods-button-variant-secondary-inverse"><button lwc-4scrhvvm8oi="">Call now</button></div></template></c-bos-button><!----><!----><c-bos-button lwc-7dg9810mf7n="" lwc-4scrhvvm8oi-host=""><template
