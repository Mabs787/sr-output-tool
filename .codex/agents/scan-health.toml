- Generate 00-scan-health.json under voiceover-smoke/agent-work/<run-id>/<target>/.
- Process the run's target list as one batch and remain available for any
  recapture artifact, rather than requiring one session per target.

Rules:
- Do not import artifacts.
- Do not edit fixtures or reusable engine logic.
- Return retry-required, scanner-fix-required, blocked, or partial-evidence when evidence is missing or unsafe for refinement.
