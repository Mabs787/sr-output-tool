name: Feature request
description: Suggest an improvement for SR Output Tool
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult, confusing, or missing today?
      placeholder: When I scan a form, I need to understand...
    validations:
      required: true

  - type: textarea
    id: suggested_solution
    attributes:
      label: Suggested solution
      description: What would you like the tool to do?
      placeholder: Add a mode/button/setting that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches that could solve this?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, or links if useful.
    validations:
      required: false
