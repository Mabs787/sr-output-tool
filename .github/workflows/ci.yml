name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Archive build output
        run: |
          tar -czf build-output.tgz \
            packages/sr-engine/dist \
            packages/sr-extension/src/content/engine-runtime.js \
            packages/sr-extension/dist/sr-extension-chrome

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: build-output.tgz
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Restore build output
        run: tar -xzf build-output.tgz

      - name: Engine unit tests
        run: yarn --cwd packages/sr-engine test:unit

      - name: Extension unit tests
        run: yarn --cwd packages/sr-extension test:unit

      - name: VoiceOver workflow unit tests
        run: yarn voiceover:workflow-tools:test

  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .

      - name: Restore build output
        run: tar -xzf build-output.tgz

      - name: Package extension
        run: node packages/sr-extension/tooling/package-extension-zip.mjs

      - name: Upload extension package
        uses: actions/upload-artifact@v6
        with:
          name: sr-output-extension
          path: packages/sr-extension/dist/*.zip
          if-no-files-found: error
