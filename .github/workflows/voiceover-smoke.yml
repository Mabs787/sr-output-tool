name: VoiceOver smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-macos-capability-check:
    name: Hosted macOS capability check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build extension runtime
        run: yarn build

      - name: Capture macOS environment
        run: |
          mkdir -p voiceover-smoke
          {
            echo "## macOS"
            sw_vers
            echo
            echo "## Runner"
            uname -a
            echo
            echo "## Node"
            node --version
            yarn --version
            echo
            echo "## VoiceOver processes before test"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/environment.txt

      - name: Check AppleScript and accessibility scripting
        run: |
          set +e
          mkdir -p voiceover-smoke

          {
            echo "## osascript sanity check"
            osascript -e 'return "osascript available"'
            echo "exit=$?"
            echo

            echo "## System Events UI scripting status"
            osascript -e 'tell application "System Events" to get UI elements enabled'
            echo "exit=$?"
            echo

            echo "## Frontmost app"
            osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true'
            echo "exit=$?"
          } > voiceover-smoke/accessibility-scripting.txt 2>&1

      - name: Create browser fixture
        run: |
          mkdir -p voiceover-smoke
          cat > voiceover-smoke/fixture.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>SR Output Tool VoiceOver Smoke Fixture</title>
            </head>
            <body>
              <main>
                <h1>VoiceOver smoke fixture</h1>
                <p>This page checks whether hosted macOS can drive browser navigation with VoiceOver.</p>
                <button type="button">Continue</button>
              </main>
            </body>
          </html>
          HTML

      - name: Launch VoiceOver and navigate fixture
        run: |
          set +e
          mkdir -p voiceover-smoke
          FIXTURE_URL="file://$PWD/voiceover-smoke/fixture.html"

          {
            echo "## Fixture"
            echo "$FIXTURE_URL"
            echo

            echo "## Launch Safari"
            osascript -e "tell application \"Safari\" to activate" \
              -e "tell application \"Safari\" to open location \"$FIXTURE_URL\""
            echo "exit=$?"
            sleep 3
            echo

            echo "## Launch VoiceOver"
            open -a VoiceOver
            echo "exit=$?"
            sleep 5
            pgrep -al VoiceOver || true
            echo

            echo "## VoiceOver right-arrow navigation"
            osascript \
              -e 'tell application "System Events"' \
              -e 'key code 124 using {control down, option down}' \
              -e 'delay 1' \
              -e 'key code 124 using {control down, option down}' \
              -e 'delay 1' \
              -e 'key code 124 using {control down, option down}' \
              -e 'end tell'
            echo "exit=$?"
            echo

            echo "## Frontmost app after navigation"
            osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true'
            echo "exit=$?"
          } > voiceover-smoke/voiceover-navigation.txt 2>&1

          screencapture voiceover-smoke/safari-after-navigation.png > voiceover-smoke/screencapture.txt 2>&1 || true

      - name: Capture VoiceOver output candidates
        run: |
          set +e
          mkdir -p voiceover-smoke

          {
            echo "## VoiceOver process snapshot"
            pgrep -al VoiceOver || true
            echo

            echo "## VoiceOver UI dump"
            osascript <<'APPLESCRIPT'
          on safeText(valueToRead)
            try
              if valueToRead is missing value then return ""
              return valueToRead as text
            on error
              return ""
            end try
          end safeText

          on describeElement(elementToRead, indentText)
            set outputText to ""
            tell application "System Events"
              try
                set elementRole to my safeText(role of elementToRead)
              on error
                set elementRole to ""
              end try
              try
                set elementName to my safeText(name of elementToRead)
              on error
                set elementName to ""
              end try
              try
                set elementValue to my safeText(value of elementToRead)
              on error
                set elementValue to ""
              end try

              if elementRole is not "" or elementName is not "" or elementValue is not "" then
                set outputText to outputText & indentText & "role=" & elementRole & " name=" & elementName & " value=" & elementValue & linefeed
              end if
            end tell
            return outputText
          end describeElement

          on describeProcess(processName)
            set outputText to "process=" & processName & linefeed
            tell application "System Events"
              if not (exists process processName) then return outputText & "missing" & linefeed
              tell process processName
                try
                  set outputText to outputText & "windowCount=" & ((count of windows) as text) & linefeed
                  repeat with windowToRead in windows
                    set outputText to outputText & my describeElement(windowToRead, "  ")
                    try
                      repeat with elementToRead in UI elements of windowToRead
                        set outputText to outputText & my describeElement(elementToRead, "    ")
                        try
                          repeat with childToRead in UI elements of elementToRead
                            set outputText to outputText & my describeElement(childToRead, "      ")
                          end repeat
                        end try
                      end repeat
                    end try
                  end repeat
                on error errorMessage number errorNumber
                  set outputText to outputText & "error=" & errorNumber & " " & errorMessage & linefeed
                end try
              end tell
            end tell
            return outputText
          end describeProcess

          return describeProcess("VoiceOver") & linefeed & describeProcess("VoiceOver Quick")
          APPLESCRIPT
            echo "exit=$?"
            echo

            echo "## Safari focused accessibility element"
            osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "Safari"
              try
                set focusedElement to value of attribute "AXFocusedUIElement"
                set focusedRole to role of focusedElement
                set focusedName to ""
                set focusedValue to ""
                try
                  set focusedName to name of focusedElement as text
                end try
                try
                  set focusedValue to value of focusedElement as text
                end try
                return "role=" & focusedRole & linefeed & "name=" & focusedName & linefeed & "value=" & focusedValue
              on error errorMessage number errorNumber
                return "error=" & errorNumber & " " & errorMessage
              end try
            end tell
          end tell
          APPLESCRIPT
            echo "exit=$?"
          } > voiceover-smoke/voiceover-output-candidates.txt 2>&1

      - name: Stop VoiceOver
        if: always()
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            osascript -e 'tell application "VoiceOver" to quit'
            echo "osascript exit=$?"
            sleep 2
            pgrep -al VoiceOver || true
            pkill -x VoiceOver || true
            pkill -x "VoiceOver Quick" || true
            sleep 1
            echo
            echo "## VoiceOver processes after cleanup"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-cleanup.txt 2>&1

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voiceover-smoke-diagnostics
          path: voiceover-smoke
          if-no-files-found: error
