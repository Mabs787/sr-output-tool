name: VoiceOver scan

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Newline, comma, or space separated page URLs to scan"
        required: true
        type: string
      capture_step_screenshots:
        description: "Save screenshots for each VoiceOver step"
        required: false
        default: false
        type: boolean
      capture_screen_recording:
        description: "Save a screen recording for each page scan"
        required: false
        default: false
        type: boolean
      screen_recording_seconds:
        description: "Maximum seconds to record when screen recording is enabled"
        required: false
        default: "180"
        type: string
      max_step_seconds:
        description: "Maximum seconds to spend on one VoiceOver navigation/capture step"
        required: false
        default: "30"
        type: string
      navigation_mode:
        description: "How VoiceOver should move between items"
        required: false
        default: voiceover-right-arrow
        type: choice
        options:
          - voiceover-right-arrow
          - plain-right-arrow

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare URL matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create URL matrix
        id: matrix
        run: |
          set -euo pipefail
          mkdir -p voiceover-smoke
          node .github/scripts/create-voiceover-url-manifest.mjs \
            --urls "${{ inputs.urls }}" \
            --output voiceover-smoke/url-manifest.json \
            --matrix-output voiceover-smoke/url-matrix.json
          {
            echo "matrix<<EOF"
            node -e "process.stdout.write(JSON.stringify(JSON.parse(require('fs').readFileSync('voiceover-smoke/url-matrix.json', 'utf8'))))"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload URL matrix
        uses: actions/upload-artifact@v6
        with:
          name: voiceover-url-matrix
          path: voiceover-smoke
          if-no-files-found: error

  chrome-fixture:
    name: Chrome fixture smoke
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create fixture manifest
        run: |
          mkdir -p voiceover-smoke/fixtures
          cat > voiceover-smoke/fixtures/chrome-fixture.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Chrome VoiceOver Fixture</title>
            </head>
            <body>
              <main data-sr-scan-root>
                <h1>Chrome fixture heading</h1>
                <ul>
                  <li><a href="#alpha">Alpha link</a></li>
                  <li><a href="#beta">Beta link</a></li>
                </ul>
                <button type="button">Fixture button</button>
              </main>
            </body>
          </html>
          HTML

          cat > voiceover-smoke/url-manifest.json <<'JSON'
          [
            {
              "name": "chrome-fixture",
              "mode": "page",
              "fixturePath": "voiceover-smoke/fixtures/chrome-fixture.html",
              "scanRootSelector": "[data-sr-scan-root]",
              "refinement": {
                "minVoiceOverAnnouncements": 1
              },
              "maxStepSeconds": 10,
              "maxSteps": 20,
              "stopWhen": {
                "voiceOverIncludes": "Fixture button",
                "repeatedNormalizedOutput": true
              }
            }
          ]
          JSON

      - name: Configure Chrome and VoiceOver
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            echo "## Environment"
            sw_vers
            echo
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /System/Library/CoreServices/VoiceOver.app/Contents/Info.plist || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /System/Library/CoreServices/VoiceOver.app/Contents/Info.plist || true
            echo

            echo "## Chrome"
            /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version || true
            osascript -e 'tell application "Google Chrome" to quit' || true
            killall "Google Chrome" || true
            sleep 2
            defaults write com.google.Chrome AllowJavaScriptFromAppleEvents -bool true
            defaults write com.apple.HIToolbox AppleDictationAutoEnable -int 0
            defaults write com.apple.assistant.support "Dictation Enabled" -bool false
            echo

            echo "## VoiceOver"
            defaults write com.apple.VoiceOverTraining doNotShowSplashScreen -bool true
            defaults write com.apple.VoiceOverTraining doNotShowWelcome -bool true
            defaults write com.apple.VoiceOverTraining didShowWelcome -bool true
            defaults write com.apple.VoiceOverTraining hasRunQuickStart -bool true
            defaults write com.apple.VoiceOverTraining quickStartCompleted -bool true
            defaults write com.apple.VoiceOverTraining showTrainingAtStartup -bool false
            defaults write com.apple.VoiceOver4/default SCREnableCaptionPanel -bool true
            for domain in com.apple.VoiceOver4/default com.apple.VoiceOver4 com.apple.VoiceOver; do
              for key in \
                SCRCognitionEnabled \
                SCRImageDescriptionsEnabled \
                SCREnableImageDescriptions \
                SCRTextRecognitionEnabled \
                SCREnableTextRecognition \
                SCRVoiceOverRecognitionEnabled \
                SCRVisualRecognitionEnabled; do
                defaults write "$domain" "$key" -bool false
              done
            done
            defaults write NSGlobalDomain AppleLiveTextEnabled -bool false
          } > voiceover-smoke/environment.txt 2>&1

      - name: Run Chrome fixture scan
        env:
          VOICEOVER_SCAN_MANIFEST: voiceover-smoke/url-manifest.json
          VOICEOVER_MAX_STEP_SECONDS: "10"
          VOICEOVER_NAVIGATION_MODE: ${{ inputs.navigation_mode }}
        run: node .github/scripts/run-voiceover-scan.mjs

      - name: Assert Chrome fixture output
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const output = JSON.parse(fs.readFileSync('voiceover-smoke/scans/chrome-fixture/voiceover-output.json', 'utf8'));
          const announcements = Array.isArray(output.announcements) ? output.announcements : [];
          const normalized = announcements
            .join('\n')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
          const expected = [
            'chrome fixture heading',
            'list 2 items',
            'alpha link',
            'beta link',
            'fixture button',
          ];
          const missing = expected.filter((phrase) => !normalized.includes(phrase));
          if (missing.length > 0) {
            console.error('Chrome fixture VoiceOver output did not include expected page content.');
            console.error(`Missing: ${missing.join(', ')}`);
            console.error('Announcements:');
            for (const announcement of announcements) {
              console.error(`- ${announcement}`);
            }
            process.exit(1);
          }
          NODE

      - name: Capture diagnostics
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            echo "## VoiceOver preferences"
            defaults read com.apple.VoiceOver4/default || true
            echo
            echo "## VoiceOver processes"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-diagnostics.txt 2>&1

      - name: Stop VoiceOver
        if: always()
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            pgrep -al VoiceOver || true
            pkill -x "VoiceOver Quick" || true
            pkill -x VoiceOver || true
            sleep 1
            pkill -9 -x "VoiceOver Quick" || true
            pkill -9 -x VoiceOver || true
            sleep 1
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-cleanup.txt 2>&1

      - name: Upload fixture artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voiceover-fixture-chrome
          path: voiceover-smoke
          if-no-files-found: error

  scan:
    name: Scan ${{ matrix.name }}
    needs:
      - prepare
      - chrome-fixture
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create single-page manifest
        run: |
          node .github/scripts/create-voiceover-url-manifest.mjs \
            --url "${{ matrix.url }}" \
            --output voiceover-smoke/url-manifest.json

      - name: Configure Chrome and VoiceOver
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            echo "## Environment"
            sw_vers
            echo
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /System/Library/CoreServices/VoiceOver.app/Contents/Info.plist || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /System/Library/CoreServices/VoiceOver.app/Contents/Info.plist || true
            echo

            echo "## Chrome"
            /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version || true
            osascript -e 'tell application "Google Chrome" to quit' || true
            killall "Google Chrome" || true
            sleep 2
            defaults write com.google.Chrome AllowJavaScriptFromAppleEvents -bool true
            defaults write com.apple.HIToolbox AppleDictationAutoEnable -int 0
            defaults write com.apple.assistant.support "Dictation Enabled" -bool false
            echo

            echo "## VoiceOver"
            defaults write com.apple.VoiceOverTraining doNotShowSplashScreen -bool true
            defaults write com.apple.VoiceOverTraining doNotShowWelcome -bool true
            defaults write com.apple.VoiceOverTraining didShowWelcome -bool true
            defaults write com.apple.VoiceOverTraining hasRunQuickStart -bool true
            defaults write com.apple.VoiceOverTraining quickStartCompleted -bool true
            defaults write com.apple.VoiceOverTraining showTrainingAtStartup -bool false
            defaults write com.apple.VoiceOver4/default SCREnableCaptionPanel -bool true
            for domain in com.apple.VoiceOver4/default com.apple.VoiceOver4 com.apple.VoiceOver; do
              for key in \
                SCRCognitionEnabled \
                SCRImageDescriptionsEnabled \
                SCREnableImageDescriptions \
                SCRTextRecognitionEnabled \
                SCREnableTextRecognition \
                SCRVoiceOverRecognitionEnabled \
                SCRVisualRecognitionEnabled; do
                defaults write "$domain" "$key" -bool false
              done
            done
            defaults write NSGlobalDomain AppleLiveTextEnabled -bool false
          } > voiceover-smoke/environment.txt 2>&1

      - name: Run VoiceOver scan
        continue-on-error: true
        env:
          VOICEOVER_SCAN_MANIFEST: voiceover-smoke/url-manifest.json
          VOICEOVER_CAPTURE_STEP_SCREENSHOTS: ${{ inputs.capture_step_screenshots && 'true' || '' }}
          VOICEOVER_CAPTURE_SCREEN_RECORDING: ${{ inputs.capture_screen_recording && 'true' || '' }}
          VOICEOVER_SCREEN_RECORDING_SECONDS: ${{ inputs.screen_recording_seconds }}
          VOICEOVER_MAX_STEP_SECONDS: ${{ inputs.max_step_seconds }}
          VOICEOVER_NAVIGATION_MODE: ${{ inputs.navigation_mode }}
        run: node .github/scripts/run-voiceover-scan.mjs

      - name: Capture diagnostics
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            echo "## VoiceOver preferences"
            defaults read com.apple.VoiceOver4/default || true
            echo
            echo "## VoiceOver processes"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-diagnostics.txt 2>&1

      - name: Stop VoiceOver
        if: always()
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            pgrep -al VoiceOver || true
            pkill -x "VoiceOver Quick" || true
            pkill -x VoiceOver || true
            sleep 1
            pkill -9 -x "VoiceOver Quick" || true
            pkill -9 -x VoiceOver || true
            sleep 1
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-cleanup.txt 2>&1

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voiceover-scan-${{ matrix.name }}
          path: voiceover-smoke
          if-no-files-found: error
