name: VoiceOver smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-macos-capability-check:
    name: Hosted macOS capability check
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Capture macOS environment
        run: |
          mkdir -p voiceover-smoke
          {
            echo "## macOS"
            sw_vers
            echo
            echo "## Runner"
            uname -a
            echo
            echo "## Node"
            node --version
            yarn --version || true
            echo
            echo "## VoiceOver processes before test"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/environment.txt

      - name: Check AppleScript and accessibility scripting
        run: |
          set +e
          mkdir -p voiceover-smoke

          {
            echo "## osascript sanity check"
            osascript -e 'return "osascript available"'
            echo "exit=$?"
            echo

            echo "## System Events UI scripting status"
            osascript -e 'tell application "System Events" to get UI elements enabled'
            echo "exit=$?"
            echo

            echo "## Frontmost app"
            osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true'
            echo "exit=$?"
          } > voiceover-smoke/accessibility-scripting.txt 2>&1

      - name: Configure VoiceOver first-run state
        run: |
          set +e
          mkdir -p voiceover-smoke

          {
            echo "## Seed VoiceOver first-run preferences"
            defaults write com.apple.VoiceOverTraining doNotShowSplashScreen -bool true
            echo "doNotShowSplashScreen exit=$?"
            defaults write com.apple.VoiceOverTraining doNotShowWelcome -bool true
            echo "doNotShowWelcome exit=$?"
            defaults write com.apple.VoiceOverTraining didShowWelcome -bool true
            echo "didShowWelcome exit=$?"
            defaults write com.apple.VoiceOverTraining hasRunQuickStart -bool true
            echo "hasRunQuickStart exit=$?"
            defaults write com.apple.VoiceOverTraining quickStartCompleted -bool true
            echo "quickStartCompleted exit=$?"
            defaults write com.apple.VoiceOverTraining showTrainingAtStartup -bool false
            echo "showTrainingAtStartup exit=$?"
            defaults write com.apple.VoiceOver4/default SCREnableCaptionPanel -bool true
            echo "SCREnableCaptionPanel exit=$?"
            echo

            echo "## Seeded domains"
            defaults read com.apple.VoiceOverTraining || true
            defaults read com.apple.VoiceOver4/default || true
          } > voiceover-smoke/voiceover-first-run-state.txt 2>&1

      - name: Create browser fixture
        run: |
          mkdir -p voiceover-smoke
          cat > voiceover-smoke/fixture.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>SR Output Tool VoiceOver Smoke Fixture</title>
            </head>
            <body>
              <main>
                <h1>VoiceOver smoke fixture</h1>
                <p>This page checks whether hosted macOS can drive browser navigation with VoiceOver.</p>
                <button type="button">Continue</button>
              </main>
            </body>
          </html>
          HTML

      - name: Launch VoiceOver and navigate fixture
        run: |
          set +e
          mkdir -p voiceover-smoke
          FIXTURE_URL="file://$PWD/voiceover-smoke/fixture.html"

          {
            echo "## Fixture"
            echo "$FIXTURE_URL"
            echo

            echo "## Launch Safari"
            osascript -e "tell application \"Safari\" to activate" \
              -e "tell application \"Safari\" to open location \"$FIXTURE_URL\""
            echo "exit=$?"
            sleep 3
            echo

            echo "## Launch VoiceOver"
            open -a VoiceOver
            echo "exit=$?"
            sleep 5
            pgrep -al VoiceOver || true
            echo

            echo "## Dismiss VoiceOver welcome"
            osascript <<'APPLESCRIPT'
          set logText to ""

          tell application "System Events"
            repeat with attemptNumber from 1 to 10
              if exists process "VoiceOver" then
                tell process "VoiceOver"
                  try
                    set logText to logText & "attempt=" & attemptNumber & " windowCount=" & ((count of windows) as text) & linefeed
                    repeat with windowToRead in windows
                      try
                        set logText to logText & "  window=" & ((name of windowToRead) as text) & linefeed
                        repeat with buttonToRead in buttons of windowToRead
                          try
                            set logText to logText & "    button=" & ((name of buttonToRead) as text) & linefeed
                          end try
                        end repeat
                      end try
                    end repeat
                  end try

                  try
                    if exists button "Use VoiceOver" of window 1 then
                      click button "Use VoiceOver" of window 1
                      set logText to logText & "clicked=Use VoiceOver" & linefeed
                      delay 2
                      exit repeat
                    end if
                  end try

                  try
                    if exists button "Continue" of window 1 then
                      click button "Continue" of window 1
                      set logText to logText & "clicked=Continue" & linefeed
                      delay 1
                    end if
                  end try
                end tell
              end if
              delay 1
            end repeat

            try
              if exists process "VoiceOver Quick" then
                key code 53
                set logText to logText & "pressed=Escape for VoiceOver Quick" & linefeed
                delay 1
              end if
            end try
          end tell

          return logText
          APPLESCRIPT
            echo "exit=$?"
            pkill -x "VoiceOver Quick" || true
            osascript -e "tell application \"Safari\" to activate"
            sleep 2
            pgrep -al VoiceOver || true
            echo

            echo "## VoiceOver right-arrow navigation"
            osascript \
              -e 'tell application "System Events"' \
              -e 'key code 124 using {control down, option down}' \
              -e 'delay 1' \
              -e 'key code 124 using {control down, option down}' \
              -e 'delay 1' \
              -e 'key code 124 using {control down, option down}' \
              -e 'end tell'
            echo "exit=$?"
            echo

            echo "## Frontmost app after navigation"
            osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true'
            echo "exit=$?"
          } > voiceover-smoke/voiceover-navigation.txt 2>&1

      - name: Capture VoiceOver cursor output
        continue-on-error: true
        run: |
          set +e
          mkdir -p voiceover-smoke

          osascript -e 'tell application "VoiceOver" to set enabled of caption window to true' > voiceover-smoke/voiceover-caption-window.txt 2>&1 || true
          osascript -e 'tell application "Safari" to activate' >> voiceover-smoke/voiceover-caption-window.txt 2>&1 || true
          pkill -x "VoiceOver Quick" >> voiceover-smoke/voiceover-caption-window.txt 2>&1 || true
          sleep 1

          {
            echo "## Initial VoiceOver state"
            osascript <<'APPLESCRIPT'
          on safeText(valueToRead)
            try
              if valueToRead is missing value then return ""
              return valueToRead as text
            on error errorMessage number errorNumber
              return "error=" & errorNumber & " " & errorMessage
            end try
          end safeText

          tell application "VoiceOver"
            set captionState to false
            try
              set captionState to enabled of caption window
            end try
            set phraseText to my safeText(content of last phrase)
            set cursorText to my safeText(text under cursor of vo cursor)
            return "captionWindowEnabled=" & (captionState as text) & linefeed & "lastPhrase=" & phraseText & linefeed & "voCursorText=" & cursorText
          end tell
          APPLESCRIPT
            echo "exit=$?"
            echo

            echo "## Safari focused accessibility element"
            osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "Safari"
              try
                set focusedElement to value of attribute "AXFocusedUIElement"
                set focusedRole to role of focusedElement
                set focusedName to ""
                set focusedValue to ""
                try
                  set focusedName to name of focusedElement as text
                end try
                try
                  set focusedValue to value of focusedElement as text
                end try
                return "role=" & focusedRole & linefeed & "name=" & focusedName & linefeed & "value=" & focusedValue
              on error errorMessage number errorNumber
                return "error=" & errorNumber & " " & errorMessage
              end try
            end tell
          end tell
          APPLESCRIPT
            echo "exit=$?"
          } > voiceover-smoke/voiceover-last-phrase.txt 2>&1

      - name: Capture VoiceOver diagnostics
        continue-on-error: true
        run: |
          set +e
          mkdir -p voiceover-smoke

          {
            echo "## VoiceOver defaults domains"
            defaults domains | tr ',' '\n' | sed 's/^ *//' | grep -i voice || true
            echo

            echo "## com.apple.VoiceOver4/default"
            defaults read com.apple.VoiceOver4/default || true
            echo

            echo "## com.apple.VoiceOver4"
            defaults read com.apple.VoiceOver4 || true
            echo

            echo "## VoiceOver process snapshot"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-diagnostics.txt 2>&1

      - name: Stop VoiceOver
        if: always()
        run: |
          set +e
          mkdir -p voiceover-smoke
          {
            echo "## VoiceOver processes before cleanup"
            pgrep -al VoiceOver || true
            pkill -x "VoiceOver Quick" || true
            pkill -x VoiceOver || true
            sleep 1
            pkill -9 -x "VoiceOver Quick" || true
            pkill -9 -x VoiceOver || true
            sleep 1
            echo
            echo "## VoiceOver processes after cleanup"
            pgrep -al VoiceOver || true
          } > voiceover-smoke/voiceover-cleanup.txt 2>&1

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voiceover-smoke-diagnostics
          path: voiceover-smoke
          if-no-files-found: error
